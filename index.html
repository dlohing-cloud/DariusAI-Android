<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="description" content="Darius AI — your personal AI agent">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/styles.css">
<title>Darius AI</title>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">D</div><div><strong>Darius AI</strong><span>Personal AI Agent</span></div></div>
  <button class="new" id="newChat">＋ New conversation</button>
  <div class="section"><span>WORKSPACES</span>
    <button class="workspace active" data-workspace="General">◉ General</button>
    <button class="workspace" data-workspace="Diplomacy">◎ Diplomacy</button>
    <button class="workspace" data-workspace="Legal">§ Legal</button>
    <button class="workspace" data-workspace="Teaching">◇ Teaching</button>
    <button class="workspace" data-workspace="Writing">✎ Writing</button>
  </div>
  <div class="sidebottom"><button id="clear">Clear chat</button><span>v1.0</span></div>
</aside>
<main>
<header><button class="mobileMenu" id="menu">☰</button><div><h1 id="title">Darius AI</h1><p id="status">Ready to help</p></div><div class="online">● Online</div></header>
<section class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="heroLogo">D</div><h2>How can Darius AI help?</h2><p>Your personal AI agent for research, writing, law, diplomacy, teaching, planning and everyday tasks.</p>
    <div class="suggestions">
      <button data-prompt="Help me draft a professional briefing note.">Draft a briefing note</button>
      <button data-prompt="Research this topic and give me the key facts and sources.">Research a topic</button>
      <button data-prompt="Help me understand this legal issue clearly.">Analyze a legal issue</button>
      <button data-prompt="Create a Grade 6 lesson plan with teacher notes.">Create a lesson plan</button>
    </div>
  </div>
</section>
<div class="composerWrap"><form id="form"><div class="composer"><textarea id="input" rows="1" placeholder="Message Darius AI…"></textarea><div class="actions"><label class="attach" title="Attach files"><input id="file" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt">＋</label><span id="files"></span><button id="send" type="submit">➤</button></div></div></form><small>Darius AI can make mistakes. Check important information.</small></div>
</main>
</div>
<script src="/app.js"></script>
</body></html>
